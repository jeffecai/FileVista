name: Bug report
description: Report a reproducible problem with FileVista
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For security problems, use the Security tab instead of a public issue.
  - type: input
    id: version
    attributes:
      label: FileVista version
      description: Found in package.json or the window title.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open FileVista
        2. Navigate to ...
        3. Right-click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: conditions
    attributes:
      label: Environment
      options:
        - label: FileVista was running as administrator
        - label: The issue happens on a network (UNC) path
        - label: The issue happens with hidden or system files
